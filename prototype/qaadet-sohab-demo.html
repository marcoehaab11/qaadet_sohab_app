<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قعدة صحاب · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--night:#140d1f;--ink:#23172f;--cream:#fff5e1;--muted:#b7aacb;--gold:#ffc83d;--gold2:#c98a00;--coral:#ff5d5d;--cyan:#35d0c9;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.07);--fd:'Lalezar','Cairo',Tahoma,sans-serif;--fb:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--night)}
body{font-family:var(--fb);color:var(--cream);min-height:100vh;display:flex;justify-content:center;overflow-x:hidden;background:radial-gradient(900px 520px at 85% -10%,rgba(155,107,255,.33),transparent 60%),radial-gradient(700px 420px at 0% 105%,rgba(255,93,93,.22),transparent 60%),var(--night);background-attachment:fixed}
#app{position:relative;width:100%;max-width:440px;min-height:100vh;padding:18px 16px 34px}
.big #app{zoom:1.12}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,[data-hold]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,.logo,.word,.bigname,.gt,.timer span,.blk,.kpis b,.code{font-family:var(--fd);font-weight:800;font-synthesis:none}
h2{font-size:30px;line-height:1.35}
h3{font-size:22px;line-height:1.4}
.screen{display:flex;flex-direction:column;gap:14px;animation:in .35s ease both}
.screen.soft{animation:none}
.still,.still *{animation:none!important}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.logo{font-size:46px;line-height:1.05;color:var(--gold);text-shadow:0 4px 0 #8a4b00,0 0 34px rgba(255,200,61,.35);transform:rotate(-2deg);display:inline-block}
.logo span{color:var(--cream);margin-inline-start:10px;text-shadow:0 4px 0 var(--coral)}
.tag{color:var(--muted);font-size:14px;margin-top:6px}
.icons{display:flex;gap:6px}
.ic{width:42px;height:42px;flex:none;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
.ic:disabled{opacity:.3}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badges span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:12px;background:rgba(255,200,61,.12);color:var(--gold);border:1px solid rgba(255,200,61,.3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:18px;background:var(--gold);color:var(--ink);font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--gold2),0 12px 24px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;text-align:center}
a.btn{text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold2)}
.btn.big{font-size:21px;padding:18px}
.btn.alt{background:var(--glass);color:var(--cream);border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.red{background:var(--coral);color:#fff;box-shadow:0 5px 0 #b3302f}
.btn.green{background:#4fd89b;box-shadow:0 5px 0 #25935f}
.btn.tv{background:var(--cyan);box-shadow:0 5px 0 #1b8f89}
.cb .btn.green{background:#56B4E9;box-shadow:0 5px 0 #2f7fb0}
.cb .btn.red{background:#E69F00;color:var(--ink);box-shadow:0 5px 0 #a87200}
.row{display:flex;gap:10px;width:100%}.row>*{flex:1}
.avs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.link{color:var(--muted);text-decoration:underline;font-size:14px;padding:6px 10px;align-self:center}
.muted{color:var(--muted);font-size:15px;line-height:1.75}
.muted2{color:#6f5f84;font-size:14px;margin-top:8px;line-height:1.6}
.hint{color:var(--muted);font-size:13px;text-align:center;line-height:1.6}
.txt2{font-size:19px;font-weight:700;line-height:1.6}
.big-e{font-size:64px;line-height:1.1;animation:pop .5s both}
.who{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);text-align:start}
.who b{display:block;font-size:17px}.who small{color:var(--muted);font-size:13px}
.stack{display:flex;padding-inline-start:10px}.stack .mini{margin-inline-start:-10px}
.mini{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:18px;border:2px solid var(--night)}
.mini.zzz{opacity:.35}
.chev{margin-inline-start:auto;font-size:20px;color:var(--muted)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel.wide{width:100%;text-align:start}
.vibes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.vibe{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border-radius:16px;background:rgba(0,0,0,.25);border:2px solid transparent;font-size:13px;font-weight:700;transition:.15s}
.vibe i{font-style:normal;font-size:26px;transition:transform .25s}
.vibe.on{border-color:var(--gold);background:rgba(255,200,61,.13)}
.vibe.on i{transform:scale(1.18) rotate(-8deg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:rgba(0,0,0,.25)}
.seg.full{width:100%}
.seg button{padding:9px 6px;border-radius:12px}
.seg button:disabled{opacity:.4}
.seg b{display:block;font-size:15px}.seg small{font-size:12px;color:var(--muted)}
.seg .on{background:var(--cream);color:var(--ink)}.seg .on small{color:#6f5f84}
.sec{margin-top:4px}
.table{border-radius:42px;padding:12px;background:linear-gradient(150deg,#94592b,#4a2911);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.3),0 22px 44px rgba(0,0,0,.5)}
.felt{border-radius:32px;padding:18px 12px;display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;background:radial-gradient(circle at 50% 30%,#167a60,#0b4a3a 70%,#07322a);box-shadow:inset 0 0 44px rgba(0,0,0,.55)}
.gc{position:relative;display:block;width:100%;background:var(--cream);color:var(--ink);border-radius:16px;padding:16px 8px 12px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2),0 12px 20px rgba(0,0,0,.35);transform:rotate(var(--rot));transition:transform .2s;animation:deal .55s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:var(--d)}
.gc:hover{transform:rotate(0) translateY(-4px) scale(1.03)}
.gc:active{transform:scale(.97)}
.gc:after{content:"";position:absolute;inset:6px;border:1.5px dashed var(--c);opacity:.45;border-radius:11px;pointer-events:none}
.gc .band{position:absolute;top:0;inset-inline:0;height:7px;background:var(--c);border-radius:16px 16px 0 0}
.gc .e{display:block;font-size:36px}
.gc b{display:block;font-size:15px;line-height:1.35;margin-top:4px}
.gc small{display:block;font-size:11.5px;color:#6f5f84;margin-top:2px;line-height:1.4}
.gc.off{filter:grayscale(1);opacity:.5}
.need{position:absolute;top:-9px;inset-inline-end:-4px;background:var(--coral);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;z-index:1}
.need.tm{background:var(--cyan);color:var(--ink)}
@keyframes deal{from{opacity:0;transform:translateY(-70px) rotate(25deg) scale(.6)}}
.foot{text-align:center;color:var(--muted);font-size:12px;opacity:.8}
.gtop{display:flex;align-items:center;gap:10px}
.gt{flex:1;font-size:22px;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:rgba(255,200,61,.15);color:var(--gold);padding:4px 10px;border-radius:12px;font-size:13px;font-weight:700}
.pill.x2{background:var(--coral);color:#fff}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{padding:6px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:700}
.help{background:var(--cream);color:var(--ink);border-radius:20px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.help .hh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.help .hh b{font-size:17px}
.help .x{width:32px;height:32px;border-radius:10px;background:rgba(35,23,47,.08);flex:none}
.help ol{padding-inline-start:22px;line-height:1.85;font-weight:700}
.stage{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:8px 0}
.who-now{color:var(--muted);font-size:15px}
.bigname{font-size:42px;line-height:1.2}
.av{flex:none;display:grid;place-items:center;border-radius:50%;background:var(--pc);box-shadow:0 0 0 5px rgba(255,255,255,.1),0 12px 34px rgba(0,0,0,.45);animation:pop .5s both}
.pc-card{width:100%;background:var(--cream);color:var(--ink);border-radius:26px;padding:24px 20px;box-shadow:0 8px 0 rgba(0,0,0,.22),0 22px 44px rgba(0,0,0,.4);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.pc-card.dark{background:#271a37;color:var(--cream);border:2px solid var(--coral)}
.pc-card.dark .muted2{color:var(--muted)}
.lbl{display:inline-block;padding:4px 14px;border-radius:12px;font-weight:800;font-size:14px;background:var(--c,#ddd);color:var(--ink);margin-bottom:10px}
.txt{font-size:23px;font-weight:800;line-height:1.55}
.word{font-size:46px;line-height:1.25}
.word.sm{font-size:30px}
.flip{animation:flipIn .5s ease both}
@keyframes flipIn{from{transform:perspective(900px) rotateY(90deg);opacity:.3}}
@keyframes pop{from{opacity:0;transform:scale(.8) rotate(-4deg)}}
.back{width:78%;aspect-ratio:3/4;border-radius:26px;border:10px solid var(--cream);background:repeating-linear-gradient(45deg,#ff5d5d 0 14px,#e14444 14px 28px);box-shadow:0 22px 44px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:70px;animation:float 3s ease-in-out infinite}
.back small{font-size:17px;font-weight:900;color:#fff;background:rgba(0,0,0,.25);padding:6px 14px;border-radius:12px}
@keyframes float{50%{transform:translateY(-8px) rotate(1.5deg)}}
.hold{position:relative;width:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer;border-radius:26px}
.hold .hsec{visibility:hidden}
.hold .hcover{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:160px;border-radius:26px;background:repeating-linear-gradient(45deg,#2c2040 0 14px,#251a36 14px 28px);border:2px dashed rgba(255,200,61,.5)}
.hold .hcover .e{font-size:44px;animation:float 2s ease-in-out infinite}
.hold .hcover b{font-size:18px}.hold .hcover small{color:var(--muted)}
.hold.on .hsec{visibility:visible}.hold.on .hcover{display:none}
.tw{display:flex;flex-direction:column;align-items:center;gap:6px}
.pz{padding:4px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:700}
.timer{--p:1;width:118px;height:118px;flex:none;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--gold) calc(var(--p)*360deg),rgba(255,255,255,.1) 0)}
.timer:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--night)}
.timer span{position:relative;z-index:1;font-size:48px}
.timer.hot{--gold:var(--coral);animation:pulse .6s infinite}
.timer.paused{animation:none;opacity:.55}
.timer.sm{width:74px;height:74px}.timer.sm:after{inset:7px}.timer.sm span{font-size:30px}
@keyframes pulse{50%{transform:scale(1.06)}}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.pbtn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:18px;background:var(--glass);border:2px solid var(--line);font-weight:700;font-size:16px;text-align:start;transition:transform .1s}
.pbtn:active{transform:scale(.96)}
.pbtn.sel{border-color:var(--gold);background:rgba(255,200,61,.15)}
.pbtn .mini{border-color:transparent}
.pbtn.buzz{min-height:88px;flex-direction:column;justify-content:center;gap:2px;background:var(--pc);color:var(--ink);border:0;box-shadow:0 6px 0 rgba(0,0,0,.35);font-size:18px;text-align:center}
.pbtn.buzz .e{font-size:30px}
.pbtn.buzz small{font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{aspect-ratio:1;border-radius:18px;background:var(--cream);color:var(--ink);display:grid;place-items:center;font-size:40px;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:pop .35s both}
.tile.q{background:#2c2040;color:var(--muted);font-size:28px;border:2px dashed var(--line);box-shadow:none}
.tile.hit{outline:4px solid #4fd89b;outline-offset:2px}
.tile.miss{outline:4px solid var(--coral);outline-offset:2px}
.cb .tile.hit{outline-color:#56B4E9}
.cb .tile.miss{outline-color:#E69F00;outline-style:dashed}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.opt{aspect-ratio:1;border-radius:16px;background:var(--glass);border:2px solid var(--line);font-size:34px}
.ban{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.ban span{background:#ffe0e0;color:#c42b2b;padding:5px 12px;border-radius:12px;font-weight:800;text-decoration:line-through}
.tally{font-weight:800;font-size:18px}
.teamtag{display:inline-block;padding:3px 12px;border-radius:12px;background:var(--pc);color:var(--ink);font-weight:800;font-size:14px}
.bars{width:100%;display:flex;flex-direction:column;gap:9px}
.bar{display:flex;align-items:center;gap:9px}
.bn{width:72px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:start}
.bn.w{width:110px}
.tr{flex:1;height:26px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.fl{height:100%;width:var(--w);border-radius:9px;background:var(--pc);animation:grow .8s ease backwards;animation-delay:var(--d)}
@keyframes grow{from{width:0}}
.bar b{min-width:24px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:9px 14px;border-radius:14px;background:var(--glass);border:2px solid var(--line);font-weight:700}
.chip.on{border-color:var(--gold);background:rgba(255,200,61,.15)}
.chip.big{font-size:18px;padding:13px 18px;background:var(--cream);color:var(--ink);border-color:transparent}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:9px;background:rgba(0,0,0,.3);font-size:12px;margin-inline-start:4px}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.decks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.deck,.lvl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:18px;background:var(--glass);border:2px solid var(--line);font-weight:700}
.deck i,.lvl i{font-style:normal;font-size:32px}
.lvl small{color:var(--muted);font-size:12px;font-weight:400}
.deck.on,.lvl.on{border-color:var(--gold);background:rgba(255,200,61,.15)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:13px;color:var(--muted)}
.note{background:rgba(255,200,61,.1);border:1px solid rgba(255,200,61,.35);padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.75;text-align:start}
.rec-dot{width:24px;height:24px;border-radius:50%;background:var(--coral);animation:ring 1s infinite}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(255,93,93,.7)}to{box-shadow:0 0 0 24px rgba(255,93,93,0)}}
.next .e{display:block;font-size:64px;line-height:1.1}
.rules{margin-top:12px;padding-top:12px;border-top:1.5px dashed rgba(35,23,47,.2);font-size:15px;color:#4a3a5c;line-height:1.75}
.pass{color:var(--gold);font-weight:700;font-size:17px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.45}}
.evc{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:20px;background:rgba(255,200,61,.14);border:2px solid var(--gold);text-align:start;animation:pop .5s both}
.evc .e{font-size:40px}.evc b{display:block;font-size:18px;color:var(--gold)}.evc small{font-size:14px}
.qd{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.qd span{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass);font-size:20px;opacity:.55}
.qd .done{opacity:.25;filter:grayscale(1)}
.qd .cur{opacity:1;background:rgba(255,200,61,.2);outline:2px solid var(--gold)}
.plist{display:flex;flex-direction:column;gap:10px;width:100%}
.prow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.prow.away{opacity:.55}
.prow .mini{width:46px;height:46px;font-size:25px;border:0}
.prow input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--cream);font:inherit;font-size:18px;font-weight:700;padding:8px 0}
.zz{flex:none;width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:16px}
.zz[aria-pressed="true"]{background:rgba(155,107,255,.35);border-color:#9b6bff}
.tdot{width:12px;height:12px;border-radius:50%;flex:none}
textarea,.field{width:100%;border-radius:16px;border:0;outline:none;padding:13px 14px;background:var(--cream);color:var(--ink);font:inherit;font-size:17px;font-weight:700}
textarea{min-height:110px;resize:none}
.err{color:#ff9b9b;font-size:13px;min-height:18px}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.citem span{flex:1;font-weight:700;line-height:1.5}
.citem .ic{width:34px;height:34px;font-size:14px}
.tg{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;text-align:start;border-bottom:1px solid var(--line)}
.tg:disabled{opacity:.45}
.tg .te{font-size:22px;width:36px;text-align:center;flex:none}
.tg .tl{flex:1}.tg .tl b{display:block;font-size:16px}.tg .tl small{color:var(--muted);font-size:13px}
.swi{flex:none;width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.15);position:relative;transition:background .2s}
.swi:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--cream);transition:inset-inline-start .2s}
.tg[aria-pressed="true"] .swi{background:var(--gold)}
.tg[aria-pressed="true"] .swi:after{inset-inline-start:23px}
.teams{display:flex;flex-direction:column;gap:8px}
.team{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border-inline-start:4px solid var(--pc)}
.team div{color:var(--muted);font-size:14px}
.cfg{padding:10px 0;border-bottom:1px solid var(--line)}.cfg:last-child{border-bottom:0}
.cfn{font-weight:800;margin-bottom:4px}
.cfr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.cfr small{color:var(--muted);font-size:13px}
.mseg{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:3px;border-radius:12px}
.mseg button{padding:5px 10px;border-radius:9px;font-size:13px;font-weight:700;min-width:46px}
.mseg .on{background:var(--cream);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.kpis b{display:block;font-size:30px;color:var(--gold)}.kpis small{color:var(--muted);font-size:12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}.hrow small{display:block;color:var(--muted);font-size:12px}.hg{font-size:18px}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aw{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:rgba(0,0,0,.2);text-align:start}
.aw .e{font-size:28px}.aw b{display:block;font-size:14px}.aw small{color:var(--muted);font-size:13px}
.shot{width:100%;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.anss{display:flex;flex-direction:column;gap:10px;width:100%}
.ans{width:100%;padding:14px;border-radius:16px;background:var(--glass);border:2px solid var(--line);font-weight:800;font-size:18px}
.ans.ok{border-color:#4fd89b;background:rgba(79,216,155,.18)}.ans.bad{border-color:var(--coral);background:rgba(255,93,93,.18)}
.cb .ans.ok{border-color:#56B4E9;background:rgba(86,180,233,.18)}.cb .ans.bad{border-color:#E69F00;border-style:dashed;background:rgba(230,159,0,.15)}
.rest{background:var(--gold);color:var(--ink);padding:0 8px;border-radius:8px}
.drawtop{display:flex;align-items:center;gap:10px;width:100%}
.pal{display:flex;flex-wrap:wrap;gap:6px;flex:1;justify-content:flex-end}
.sw{width:38px;height:38px;border-radius:50%;background:var(--sc);border:3px solid rgba(255,255,255,.2);font-size:16px;transition:transform .1s}
.sw.on{border-color:var(--gold);transform:scale(1.12)}
.sw.clr{background:var(--glass)}
.cv{width:100%;height:320px;border-radius:20px;background:var(--cream);touch-action:none;box-shadow:0 8px 0 rgba(0,0,0,.2);display:block}
.podium{display:flex;align-items:flex-end;gap:10px;width:100%}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.blk{width:100%;display:grid;place-items:center;font-size:32px;color:var(--ink);border-radius:14px 14px 6px 6px;background:linear-gradient(180deg,var(--pc),rgba(0,0,0,.25));transform-origin:bottom;animation:rise .7s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes rise{from{transform:scaleY(0)}}
.obdots{display:flex;gap:6px;justify-content:center}
.obdots span{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.25)}
.obdots .on{background:var(--gold);width:24px}
.obl{display:flex;flex-direction:column;gap:10px;width:100%;text-align:start}
.obl div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-weight:700}
.obl i{font-style:normal;font-size:26px}
.lock{display:inline-block;font-family:var(--fb);font-size:12px;padding:2px 8px;border-radius:9px;background:rgba(155,107,255,.28);color:#e2d6ff;font-weight:700;vertical-align:middle}
.pk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2)}
.pk .e{font-size:26px}.pk b{flex:1}
.code{font-size:30px;letter-spacing:10px;text-align:center;padding:12px;border-radius:14px;background:rgba(0,0,0,.25);color:var(--muted)}
.conf{position:fixed;top:-50px;z-index:20;font-size:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(600deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:30;background:var(--cream);color:var(--ink);padding:10px 18px;border-radius:14px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.45);white-space:nowrap;animation:tin 1.8s ease forwards}
@keyframes tin{0%{opacity:0;transform:translate(-50%,-16px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.crown{font-size:19px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

let T = null;
function clearT(){ if (T) { clearInterval(T.h); T = null; } }
function tLeft(){ return T ? Math.max(0, Math.ceil((T.paused ? T.rem : (T.end - Date.now())) / 1000)) : 0; }
function startT(sec, onEnd){ clearT(); const g = S.g; T = {sec, end: Date.now() + sec * 1000, last: null, paused: false, f: () => { if (S.g === g) onEnd(); }}; T.h = setInterval(tick, 200); tick(); }
function tick(){

  if (el) { el.textContent = left; const w = el.parentElement; w.style.setProperty('--p', left / T.sec); w.classList.toggle('hot', left <= 5); }
  if (left !== T.last) { T.last = left; if (left > 0 && left <= 3) beep(880, .07); }
  if (left <= 0) { const f = T.f; clearT(); beep(440, .4); buzz(200); f(); }
}
function syncPause(){
  const p = !!(T && T.paused);
  document.querySelectorAll('.pz').forEach(b => { b.textContent = p ? '▶ كمّل' : '⏸ وقّف'; b.setAttribute('aria-pressed', String(p)); });
  document.querySelectorAll('.timer').forEach(t => { t.classList.toggle('paused', p); if (p) t.classList.remove('hot'); });
}

  const t = `<div class="timer${sm ? ' sm' : ''}${T && left <= 5 && !pz ? ' hot' : ''}${pz ? ' paused' : ''}" style="--p:${p}"><span id="tm">${left}</span></div>`;

  changes.forEach(([i, v]) => { P(i).score += v; });
  (stats || []).forEach(([i, k]) => stat(i, k));
  S.log.push({c: changes, s: stats || []}); if (S.log.length > 60) S.log.shift();
}

  e.s.forEach(([i, k]) => { const s = S.stats[i]; if (s && s[k]) s[k]--; });

/* ================= SESSION ================= */
function buildQueue(){
  const ok = id => GAMES[id].min <= NA(), L = LENS[S.len].n;
  let pool = shuffle(VIBES[S.vibe].pool.filter(ok));
  if (S.vibe === 'deceive' && pool.includes('imposter')) pool = ['imposter', ...pool.filter(x => x !== 'imposter')];
  if (pool.length < L) pool = [...pool, ...shuffle(Object.keys(GAMES).filter(ok).filter(x => !pool.includes(x)))];
  return pool.slice(0, L);
}
function enterHost(){
  const s = S.session, ev = s.ev[s.idx];
  if (ev && !s.done[s.idx]) {
    s.done[s.idx] = true;
    const order = act().sort((a, b) => P(b).score - P(a).score), first = order[0], last = order[order.length - 1];
    if (ev === 'steal' && P(first).score > P(last).score && P(first).score > 0) { addPts([[first, -1], [last, 1]]); s.evTxt = `${P(last).emoji} ${P(last).name} سرق نقطة من ${P(first).emoji} ${P(first).name}`; }
    else if (ev === 'steal' || ev === 'gift') { s.ev[s.idx] = 'gift'; addPts([[last, 1]]); s.evTxt = `${P(last).emoji} ${P(last).name} خد نقطة هدية`; }
    else s.evTxt = EVENTS.double.d;
  }
  go('host');
}
function saveHistory(){
  const s = S.session; if (s.saved) return; s.saved = true;
  const ps = [...S.players].sort((a, b) => b.score - a.score);
  S.data.history.unshift({d: Date.now(), w: {n: ps[0].name, e: ps[0].emoji}, g: s.queue, p: ps.map(p => ({n: p.name, e: p.emoji, s: p.score}))});
  S.data.history = S.data.history.slice(0, 40);
  if (S.data.history.length >= 3 && !S.data.reviewAsked) { S.data.reviewAsked = true; S.showReview = true; }
  save();
}
function nextHost(){
  const s = S.session;
  if (s.idx < s.queue.length) return enterHost();
  if (!s.tbDone) {
    const a = act(), mx = Math.max(...a.map(i => P(i).score)), tied = a.filter(i => P(i).score === mx);
    if (tied.length > 1) { S.tb = {tied, step: 'ready', out: [], win: null, ch: null}; go('tiebreak'); return; }
  }
  saveHistory(); go('final');
}

  S.mult = S.inSession && S.session && S.session.ev[S.session.idx] === 'double' ? 2 : 1;
  S.data.plays[id] = (S.data.plays[id] || 0) + 1; save();
  S.g = {id, step: null, k: 0}; G[id].init(S.g); S.screen = 'game'; render();
}

  let on = false, lx = 0, ly = 0;

  const style = () => { const c = (S.g && S.g.col) || '#23172f'; x.strokeStyle = c === 'erase' ? '#fff5e1' : c; x.lineWidth = c === 'erase' ? 26 : 6; };

/* ================= ACTIONS ================= */
function czErr(m){ S.cz.err = m; const e = document.getElementById('cErr'); if (e) e.textContent = m; }
function fixNames(){ S.players.forEach((p, i) => { p.name = p.name.trim() || ('لاعب ' + (i + 1)); }); }
function finishOb(){ fixNames(); S.data.onboarded = true; S.ob = 0; save(); }
const A = {
  go: v => go(v),
  home: () => { stopRec(); clearT(); S.g = null; S.inSession = false; S.mult = 1; S.backTo = null; try { speechSynthesis.cancel(); } catch (e) {} go('home'); },
  vibe: v => { S.vibe = v; render(); },
  len: v => { S.len = v; render(); },
  startSession: () => {
    S.players.forEach(p => { p.score = 0; }); S.stats = S.players.map(() => ({})); S.log = []; S.pun = null; S.shareUrl = null; S.showReview = false; S.tb = null;
    S.data.last = {vibe: S.vibe, len: S.len}; save();
    const q = buildQueue();
    const ev = q.map((_, i) => i === 0 || !set().surprise ? null : (Math.random() < .45 ? pick(['double','steal','gift']) : null));
    if (set().surprise && S.len === 'fire' && !ev.some(Boolean)) ev[2 + rnd(q.length - 2)] = pick(['double','steal','gift']);
    S.session = {queue: q, idx: 0, ev, done: {}, saved: false, tbDone: false, evTxt: ''}; S.inSession = false; enterHost();
  },
  lastSession: () => { S.vibe = S.data.last.vibe; S.len = S.data.last.len; A.startSession(); },
  resume: () => enterHost(),
  hostPlay: v => { S.inSession = true; startGame(v); },
  play: v => { S.inSession = false; startGame(v); },
  skipGame: () => { S.session.idx++; nextHost(); },
  endGame: () => endGame(),
  again: () => { S.inSession = false; startGame(S.lastGame); },
  soon: () => { S.soonFrom = S.screen === 'settings' ? 'settings' : 'home'; go('soon'); },
  soonBack: () => go(S.soonFrom || 'home'),

  tpause: () => { if (!T) { toast('التايمر مش شغال لسه'); return; } if (T.paused) resumeT(); else pauseT(); },
  help: () => { const h = document.getElementById('help'); if (!h) return; h.hidden = !h.hidden; if (!h.hidden) pauseT(); document.querySelectorAll('.tool[data-a="help"]').forEach(b => b.setAttribute('aria-expanded', String(!h.hidden))); },
  undo: () => { const ok = undo(); if (ok && !(S.g && S.g.id === 'draw' && S.g.step === 'draw')) render(); },
  ppl: () => { S.backTo = S.g ? 'game' : (S.screen === 'host' ? 'host' : null); pauseT(); S.screen = 'players'; render(); },

  pl_add: () => {
    if (N() >= 8) return;
    const late = liveSession() && S.players.some(p => p.score !== 0);
    addPlayer();
    if (late) { const a = act().filter(i => i !== N() - 1), avg = Math.round(a.reduce((s, i) => s + P(i).score, 0) / Math.max(1, a.length)); P(N() - 1).score = avg; toast(`${P(N() - 1).emoji} اللاعب الجديد بدأ بـ ${avg} نقطة (متوسط القعدة)`); }
    save(); render();
  },
  pl_del: v => { if (N() > 2 && !S.g) { S.players.splice(+v, 1); S.stats.splice(+v, 1); S.log = []; ensureTeams(); save(); render(); } },
  pl_av: v => { const p = P(+v); p.emoji = AV[(AV.indexOf(p.emoji) + 1) % AV.length]; save(); render(); },
  pl_away: v => { const p = P(+v); if (!p.away && NA() <= 2) { toast('لازم يفضل اتنين موجودين على الأقل'); return; } p.away = !p.away; render(); },
  pl_done: () => {
    fixNames(); save(); const b = S.backTo; S.backTo = null;
    if (b === 'game' && S.g) { S.screen = 'game'; render(); }
    else if (b === 'host' && liveSession()) go('host');
    else go('home');
  },

  ob_next: () => { if (S.ob === 1) fixNames(); S.ob = Math.min(2, S.ob + 1); render(); },
  ob_skip: () => { finishOb(); go('home'); },
  ob_start: () => { finishOb(); A.startSession(); },
  ob_replay: () => { S.ob = 0; go('onboard'); },

  set_tg: v => {
    const st = set(); st[v] = !st[v];
    if (v === 'teams' && st.teams) ensureTeams();
    if (v === 'tts' && st.tts) say('أهلًا بيكم في قعدة صحاب');
    if (v === 'cb') S.players.forEach((p, i) => { p.color = (st.cb ? COL_CB : COL)[i % 8]; });
    save(); render();
  },
  set_shuf: () => { assignTeams(); save(); render(); },
  set_say: () => say('أهلًا بيكم في قعدة صحاب. الدور على ' + P(0).name),
  set_season: v => { set().season = v; save(); render(); },
  set_mem: v => { set().memDiff = v; save(); render(); },
  set_tb: v => { set().tabooDiff = v; save(); render(); },
  cfg: v => { const [id, k, o] = v.split('|'); (S.data.cfg[id] || (S.data.cfg[id] = {}))[k] = +o; save(); render(); },

  cz_t: v => { S.cz.t = v; S.cz.err = ''; render(); },
  cz_ct: v => { S.cz.ct = v; render(); },
  cz_add: () => {
    const el = document.getElementById('cIn'), raw = ((el && el.value) || '').trim(), t = S.cz.t, list = C()[t];
    if (!raw) return czErr('اكتب حاجة الأول');
    let item;
    if (t === 'taboo') { const parts = raw.split(/[،,]/).map(s => s.trim()).filter(Boolean); if (parts.length !== 4) return czErr('اكتب الكلمة و3 كلمات ممنوعة، مفصولين بفاصلة'); item = [parts[0], parts.slice(1)]; }
    else if (t === 'cards') item = [S.cz.ct, raw];
    else item = raw;
    const key = JSON.stringify(item); if (list.some(x => JSON.stringify(x) === key)) return czErr('دي موجودة قبل كده');
    list.push(item); S.cz.err = ''; save(); render(); toast('اتضافت ✓');
    setTimeout(() => { const e = document.getElementById('cIn'); if (e) e.focus(); }, 50);
  },
  cz_del: v => { C()[S.cz.t].splice(+v, 1); save(); render(); },
  st_clear: () => { S.data.history = []; S.data.plays = {}; save(); render(); toast('السجل اتمسح'); },

  tb_start: () => { const t = S.tb; t.out = []; t.step = 'count'; render(); startT(3, () => { t.ch = draw('sp', CONTENT.speed); t.step = 'go'; render(); buzz(80); }); },
  tb_buzz: v => { const t = S.tb; if (!t || t.step !== 'go') return; t.win = +v; t.step = 'win'; buzz(120); beep(990, .12); render(); },
  tb_yes: () => { pts(S.tb.win, 1); S.session.tbDone = true; S.tb = null; saveHistory(); go('final'); },
  tb_no: () => { const t = S.tb; t.out.push(t.win); if (t.out.length >= t.tied.length) { t.step = 'ready'; toast('محدش جابها، تحدي جديد'); render(); return; } t.step = 'go'; render(); },
  tb_draw: () => { S.session.tbDone = true; S.tb = null; saveHistory(); go('final'); },

  rv_ok: () => { S.showReview = false; render(); },
  pun: () => { const mn = Math.min(...S.players.map(p => p.score)), low = S.players.map((p, i) => p.score === mn ? i : -1).filter(i => i >= 0); S.pun = {i: pick(low), t: draw('pun', CONTENT.punish)}; buzz(80); render(); },
  share_make: async () => { toast('بنجهّز الكارت...'); try { S.shareUrl = await makeCard(); render(); } catch (e) { toast('معرفتش أعمل الكارت هنا'); } },
  share_os: async () => {
    try {
      const f = new File([dataToBlob(S.shareUrl)], 'qaadet-sohab.jpg', {type: 'image/jpeg'});
      if (navigator.canShare && navigator.canShare({files: [f]})) await navigator.share({files: [f], title: 'قعدة صحاب', text: resultText()});
      else throw new Error('no-share');
    } catch (e) { if (e && e.name === 'AbortError') return; toast('الشير مش متاح هنا. نزّل الصورة'); }
  },

  imp_mode: v => { S.g.mode = v; render(); },
  imp_n: v => { S.g.nImp = +v; render(); },
  imp_cat: v => { S.g.cat = v; render(); },
  imp_start: () => {
    const g = S.g; g.pl = act(); const k = g.nImp === 2 && g.pl.length >= 6 ? 2 : 1;
    g.imps = shuffle(g.pl).slice(0, k); g.acc = []; g.caught = []; g.escaped = []; g.stole = false;
    if (g.mode === 'under') { const pr = draw('und', CONTENT.undercover), f = Math.random() < .5; g.word = f ? pr[1] : pr[0]; g.alt = f ? pr[0] : pr[1]; g.catName = null; }
    else { const cats = impCats(), keys = Object.keys(cats); g.catName = g.cat === 'rand' || !cats[g.cat] ? pick(keys) : g.cat; g.word = draw('imp' + g.catName, cats[g.catName]); g.alt = null; }
    g.starter = pick(g.pl); g.ri = 0; g.turn = g.pl[0]; g.step = 'pass'; render();
  },
  imp_show: () => { S.g.step = 'show'; render(); },
  imp_next: () => { const g = S.g; g.ri++; if (g.ri < g.pl.length) { g.turn = g.pl[g.ri]; g.step = 'pass'; g.k++; render(); } else { g.step = 'talk'; render(); startT(cfg('imposter', 'time'), () => { g.step = 'vote'; render(); }); } },
  imp_vote: () => { clearT(); S.g.step = 'vote'; S.g.acc = []; render(); },
  imp_sel: v => { const g = S.g, i = +v, k = g.imps.length; if (g.acc.includes(i)) g.acc = g.acc.filter(x => x !== i); else { g.acc = [...g.acc, i]; if (g.acc.length > k) g.acc.shift(); } render(); },
  imp_acc: () => {
    const g = S.g, k = g.imps.length;
    if (g.acc.length < k) { toast(`اختاروا ${k > 1 ? '2 أشخاص' : 'شخص'} الأول`); return; }
    g.caught = g.imps.filter(i => g.acc.includes(i)); g.escaped = g.imps.filter(i => !g.acc.includes(i));
    if (g.caught.length) { const v = g.caught.length * S.mult; addPts(g.pl.filter(j => !g.imps.includes(j)).map(j => [j, v]), g.caught.map(i => [i, 'busted'])); toast(`🎯 ${pl(v)} لكل واحد في القعدة`); beep(1180, .1); }
    g.escaped.forEach(i => pts(i, 2, 'fox'));
    if (g.caught.length) { const pool = g.mode === 'under' ? CONTENT.undercover.flat().filter(w => w !== g.word && w !== g.alt) : impCats()[g.catName].filter(w => w !== g.word); g.opts = shuffle([g.word, ...shuffle(pool).slice(0, 3)]); g.step = 'caught'; }
    else g.step = 'result';
    render();
  },
  imp_guess: v => { const g = S.g; if (v === g.word) { g.stole = true; g.caught.forEach(i => pts(i, 1)); } g.step = 'result'; render(); },
  imp_again: () => { S.g.step = 'setup'; S.g.k++; render(); },

  cd_deck: v => { S.g.deck = v; render(); },
  cd_go: () => { S.g.turn = rndA(); S.g.step = 'back'; render(); },
  cd_flip: () => { const g = S.g, d = decks()[g.deck] || decks().friends; g.card = draw('cd' + g.deck, d.cards); g.step = 'face'; render(); },
  cd_timer: () => startT(cfg('cards', 'time'), () => toast('⏰ الوقت خلص!')),
  cd_skip: () => { const g = S.g; g.turn = nextA(g.turn); g.k++; render(); },
  cd_next: v => { const g = S.g; clearT(); if (v === '1') pts(g.turn, 1, 'brave'); else stat(g.turn, 'chicken'); g.count++; if (g.count >= g.max) return endGame(); g.turn = nextA(g.turn); g.step = 'back'; g.k++; render(); },

  mem_go: () => {
    const g = S.g; g.grid = shuffle(CONTENT.memory).slice(0, g.size); g.tap = null; g.ans = rnd(g.size); g.step = 'look'; g.k++; render();
    startT(cfg('memory', 'time'), () => { g.q = Math.random() < .5 ? 'where' : 'miss'; if (g.q === 'miss') g.opts = shuffle([g.grid[g.ans], ...shuffle(CONTENT.memory.filter(e => !g.grid.includes(e))).slice(0, 3)]); g.step = 'ask'; render(); });
  },
  mem_ans: v => { const g = S.g, i = g.order[g.ti]; if (g.q === 'where') { g.tap = +v; g.ok = +v === g.ans; } else g.ok = v === g.grid[g.ans]; if (g.ok) pts(i, 1, 'mem'); else buzz(120); g.step = 'res'; render(); },
  mem_next: () => { const g = S.g; if (!advance(g)) return endGame(); g.step = 'pass'; g.k++; render(); },

  lk_start: () => { const g = S.g; g.step = 'vote'; g.voters = act(); g.vi = 0; g.votes = []; render(); },
  lk_vote: v => {
    const g = S.g; g.votes.push(+v); g.vi++; buzz(30);
    if (g.vi >= g.voters.length) {
      const cnt = S.players.map((_, i) => g.votes.filter(x => x === i).length), mx = Math.max(...cnt);
      addPts(g.voters.filter((vi, idx) => cnt[g.votes[idx]] === mx).map(vi => [vi, S.mult]), S.players.map((_, i) => i).filter(i => cnt[i] === mx).map(i => [i, 'gossip']));
      g.step = 'res';
    } else g.k++;
    render();
  },
  lk_next: () => { const g = S.g; g.qi++; if (g.qi >= g.max) return endGame(); g.q = draw('lk', poolLikely()); g.step = 'q'; g.k++; render(); },

  tb_go: () => { const g = S.g; g.got = 0; g.bad = 0; g.w = draw('tb' + set().tabooDiff, poolTaboo()); g.step = 'play'; render(); startT(cfg('taboo', 'time'), () => { g.step = 'res'; render(); }); },
  tb_ok: () => { const g = S.g, i = g.order[g.ti]; g.got++; if (teamOn()) tpts(P(i).team, 1, i, 'tongue'); else pts(i, 1, 'tongue'); g.w = draw('tb' + set().tabooDiff, poolTaboo()); g.k++; render(); },
  tb_bad: () => { const g = S.g, i = g.order[g.ti]; g.bad++; if (teamOn()) tpts(P(i).team, -1, i, 'oops'); else pts(i, -1, 'oops'); buzz(150); g.w = draw('tb' + set().tabooDiff, poolTaboo()); g.k++; render(); },
  tb_skip: () => { const g = S.g; g.w = draw('tb' + set().tabooDiff, poolTaboo()); g.k++; render(); },
  tb_next: () => { const g = S.g; clearT(); if (!advance(g)) return endGame(); g.step = 'pass'; g.k++; render(); },

  sp_go: () => { const g = S.g; g.out = []; g.win = null; g.step = 'count'; render(); startT(3, () => { g.ch = draw('sp', CONTENT.speed); g.step = 'go'; render(); buzz(80); }); },
  sp_buzz: v => { const g = S.g; if (g.step !== 'go') return; g.win = v; g.step = 'win'; buzz(120); beep(990, .12); render(); },
  sp_yes: () => { const w = S.g.win; if (w[0] === 't') tpts(+w.slice(1), 1); else pts(+w, 1, 'flash'); A.sp_skip(); },
  sp_no: () => { const g = S.g; g.out.push(g.win); if (g.out.length >= (teamOn() ? 2 : NA())) return A.sp_skip(); g.step = 'go'; g.k++; render(); },
  sp_skip: () => { const g = S.g; g.ci++; if (g.ci >= g.max) return endGame(); g.step = 'ready'; g.k++; render(); },

  km_go: () => { const g = S.g; g.q = draw('km', CONTENT.knowme); g.step = 'write'; render(); setTimeout(() => { const t = document.getElementById('kmIn'); if (t) t.focus(); }, 350); },
  km_lock: () => { const g = S.g, t = document.getElementById('kmIn'); g.ans = (t && t.value.trim()) || 'قالها في سرّه 😄 يقولها بصوت عالي دلوقتي'; g.step = 'guess'; render(); },
  km_reveal: () => { S.g.step = 'reveal'; S.g.sel = []; render(); },
  km_sel: v => { const g = S.g, i = +v; g.sel = g.sel.includes(i) ? g.sel.filter(x => x !== i) : [...g.sel, i]; render(); },
  km_done: v => { const g = S.g; if (v === '1') g.sel.forEach(i => pts(i, 1, 'guess')); g.done++; if (g.done >= g.max) return endGame(); g.subj = nextA(g.subj); g.step = 'pass'; g.k++; render(); },

  td_lvl: v => { S.g.lvl = v; render(); },
  td_go: () => { S.g.step = 'pick'; render(); },
  td_pick: v => { const g = S.g; g.kind = v; g.text = draw('td' + g.lvl + v, poolTod(g.lvl, v)); g.step = 'show'; render(); },
  td_skip: () => { const g = S.g; g.done++; if (g.done >= g.max) return endGame(); g.turn = nextA(g.turn); g.k++; render(); },
  td_next: v => { const g = S.g; if (v === '1') pts(g.turn, 1, 'brave'); else stat(g.turn, 'chicken'); g.done++; if (g.done >= g.max) return endGame(); g.turn = nextA(g.turn); g.step = 'pick'; g.k++; render(); },

  ch_peek: () => { const g = S.g; g.text = draw('ch', poolCharades()); g.gw = null; g.step = 'peek'; render(); },
  ch_act: () => { const g = S.g; g.step = 'act'; render(); startT(cfg('charades', 'time'), () => { g.step = 'res'; render(); }); },
  ch_got: v => { const g = S.g, i = g.order[g.ti]; clearT(); if (v === 'team') { g.gw = 'team'; tpts(P(i).team, 1, i, 'act'); } else { g.gw = +v; pts(i, 1, 'act'); pts(g.gw, 1, 'guess'); } g.step = 'res'; render(); },
  ch_fail: () => { clearT(); S.g.gw = null; S.g.step = 'res'; render(); },
  ch_next: () => { const g = S.g; clearT(); if (!advance(g)) return endGame(); g.step = 'pass'; g.k++; render(); },

  vc_secret: () => { const g = S.g; g.text = draw('vc', CONTENT.voice); g.buf = null; g.rev = null; g.gw = null; g.step = 'secret'; render(); },
  vc_rec: async () => {
    const g = S.g;
    try {
      ac().resume();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) throw new Error('no-mic');
      const st = await navigator.mediaDevices.getUserMedia({audio: true});
      if (S.g !== g) { st.getTracks().forEach(t => t.stop()); return; }
      const chunks = [], mr = new MediaRecorder(st); MR = mr;
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = async () => {
        st.getTracks().forEach(t => t.stop()); MR = null; if (S.g !== g) return;
        try { const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'}); g.buf = await ac().decodeAudioData(await blob.arrayBuffer()); g.step = 'play'; }
        catch (e) { g.micErr = true; g.step = 'secret'; }
        render();
      };
      mr.start(); g.step = 'rec'; render(); startT(4, stopRec);
    } catch (e) { g.micErr = true; render(); }
  },
  vc_stop: () => stopRec(),
  vc_nomic: () => { S.g.step = 'play'; render(); },
  vc_play: v => playFx(v),
  vc_got: v => { const g = S.g; g.gw = +v; pts(g.turn, 1); pts(g.gw, 1, 'guess'); g.step = 'res'; render(); },
  vc_fail: () => { S.g.step = 'res'; render(); },
  vc_next: () => { const g = S.g; g.done++; if (g.done >= g.max) return endGame(); g.turn = nextA(g.turn); g.step = 'pass'; g.k++; render(); },

  tv_go: () => {
    const g = S.g, q = draw('tv', CONTENT.trivia); g.q = q[0]; g.correct = q[1][0]; g.opts = shuffle(q[1]); g.pick = null; g.to = false; g.step = 'q'; render();
    startT(cfg('trivia', 'time'), () => { g.ok = false; g.to = true; g.step = 'res'; buzz(120); render(); });
  },
  tv_ans: v => { const g = S.g, i = g.order[g.ti]; clearT(); g.pick = g.opts[+v]; g.ok = g.pick === g.correct; g.to = false; if (g.ok) pts(i, 1, 'nerd'); else buzz(120); g.step = 'res'; render(); },
  tv_next: () => { const g = S.g; clearT(); if (!advance(g)) return endGame(); g.step = 'pass'; g.k++; render(); },

  pv_rev: () => { S.g.step = 'reveal'; render(); },
  pv_got: v => { pts(+v, 1, 'elder'); A.pv_next(); },
  pv_none: () => A.pv_next(),
  pv_next: () => { const g = S.g; g.qi++; if (g.qi >= g.max) return endGame(); g.pv = draw('pv', CONTENT.proverbs); g.step = 'show'; g.k++; render(); },

  dr_peek: () => { const g = S.g; g.word = draw('dr', poolDraw()); g.gw = null; g.step = 'peek'; render(); },
  dr_go: () => { const g = S.g; g.col = '#23172f'; g.step = 'draw'; render(); startT(cfg('draw', 'time'), () => { g.gw = null; g.step = 'res'; render(); }); },
  dr_col: (v, el) => { S.g.col = v; document.querySelectorAll('.pal .sw').forEach(s => s.classList.toggle('on', s === el)); },
  dr_clr: () => clearCanvas(),
  dr_got: v => { const g = S.g, i = g.order[g.ti]; clearT(); g.gw = +v; pts(i, 1, 'artist'); pts(g.gw, 1, 'guess'); g.step = 'res'; render(); },
  dr_fail: () => { clearT(); S.g.gw = null; S.g.step = 'res'; render(); },
  dr_next: () => { const g = S.g; clearT(); if (!advance(g)) return endGame(); g.step = 'pass'; g.k++; render(); }
};

/* ================= EVENTS ================= */
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  try { const c = ac(); if (c.state === 'suspended') c.resume(); } catch (_) {}
  const f = A[el.dataset.a]; if (f) f(el.dataset.v, el);
});
$app.addEventListener('input', e => {
  const i = e.target.dataset.pi; if (i !== undefined) S.players[+i].name = e.target.value;
  if (e.target.id === 'cIn' && S.cz.err) czErr('');
});
$app.addEventListener('keydown', e => {
  if (e.target.id === 'cIn' && e.key === 'Enter') { e.preventDefault(); A.cz_add(); }
  if (e.target.matches && e.target.matches('[data-hold]') && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); e.target.classList.add('on'); }
});
$app.addEventListener('keyup', e => { if (e.target.matches && e.target.matches('[data-hold]')) e.target.classList.remove('on'); });
$app.addEventListener('pointerdown', e => { const h = e.target.closest('[data-hold]'); if (h) { h.classList.add('on'); buzz(15); } });
const unhold = () => document.querySelectorAll('.hold.on').forEach(h => h.classList.remove('on'));
window.addEventListener('pointerup', unhold); window.addEventListener('pointercancel', unhold); window.addEventListener('blur', unhold);
$app.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]') || e.target.closest('canvas')) e.preventDefault(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseT(); });

/* ================= BOOT ================= */
function boot(){
  S.autoSeason = autoSeason();
  if (S.stats.length !== N()) S.stats = S.players.map(() => ({}));
  ensureTeams();
  if (!S.data.onboarded) { S.ob = 0; S.screen = 'onboard'; }
  render();
}
Promise.race([load(), new Promise(r => setTimeout(() => r(null), 1500))]).then(d => { if (d) applyData(d); boot(); }).catch(() => boot());
</script>
</body>
</html>
